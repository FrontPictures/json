site_name: Simplified JSON for C++
site_description: Documentation for the compiled FrontPictures JSON fork
repo_name: FrontPictures/json
repo_url: https://github.com/FrontPictures/json
edit_uri: edit/fp/docs/mkdocs/docs/
theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Overview: index.md
  - CMake: cmake.md
  - Values and conversions: values.md
  - Containers and iteration: containers.md
  - Parsing and errors: parsing.md
  - Text output: serialization.md
  - Binary formats: binary.md
  - Pointers and patches: pointers.md
  - API reference: api.md
  - Migration: migration.md
markdown_extensions:
  - tables
  - fenced_code
plugins:
  - search
